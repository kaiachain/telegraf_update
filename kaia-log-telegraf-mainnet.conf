# =============================================================================
# kaia-log-telegraf-mainnet.conf
# Place in /etc/telegraf/telegraf.d/ on each Mainnet CN node.
# =============================================================================

[[inputs.tail]]
  files = ["/var/kcnd/logs/kcnd.out"]
  from_beginning = false
  watch_method = "inotify"
  name_override = "kaia_log"
  data_format = "value"
  data_type = "string"

[[outputs.influxdb]]
  urls = ["http://node.kaia.io:45560"]
  database = "mainnet-log"
  namepass = ["kaia_log"]
