# =============================================================================
# kaia-log-telegraf-kairos.conf
# Place in /etc/telegraf/telegraf.d/ on each Kairos CN node.
#
# Also add the following line to the existing [[outputs.influxdb]] block
# in the main telegraf config to avoid log data polluting the metrics DB:
#
#   namedrop = ["kcnd_log"]
# =============================================================================

[[inputs.tail]]
  files = ["/var/kcnd/logs/kcnd.out"]
  from_beginning = false
  name_override = "kcnd_log"
  data_format = "value"
  data_type = "string"

[[outputs.influxdb]]
  urls = ["http://node.kaia.io:45560"]
  database = "kairos_logs"
  namepass = ["kcnd_log"]
